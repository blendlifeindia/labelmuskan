server {
 listen 80;
 listen [::]:80;
 server_name labelmuskan.online www.labelmuskan.online;
 root /var/www/labelmuskan;
 index index.html;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Cache-Control "no-store" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xybqwszhkbiucgextwog.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location / { try_files $uri $uri/ =404; }
 location ~ /\. { deny all; }
}
